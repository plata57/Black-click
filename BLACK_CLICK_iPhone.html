<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLACK CLICK</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
#home,#game,#win{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center}
#home{padding:25px;background:radial-gradient(circle at 50% 35%,#171126 0,#05070b 45%,#000 100%)}
h1{font-size:48px;line-height:.95;margin:0 0 18px;font-weight:900}h1 span{color:#7655ff}
p{color:#aab2c0;font-size:17px;line-height:1.5;max-width:340px}
button{border:0;border-radius:15px;background:#7655ff;color:#fff;font-size:17px;font-weight:800;padding:17px 28px;margin-top:18px}
.small{font-size:12px;color:#657083;margin-top:20px}
#game{display:none;position:relative;background:#000}
#count{position:absolute;top:25px;left:0;right:0;color:#7d8797;font-size:15px}
#target{display:none;position:absolute;width:68px;height:68px;border-radius:50%;background:#7655ff;border:5px solid #fff;box-shadow:0 0 40px #7655ff;transform:translate(-50%,-50%);padding:0;margin:0}
#win{display:none;flex-direction:column;padding:30px;background:#070a0f}
#win h2{font-size:42px;margin:0 0 10px}.time{font-size:52px;font-weight:900;color:#57e7a1;margin:20px}
</style>
</head>
<body>
<section id="home">
<div>
<h1>BLACK<br><span>CLICK</span></h1>
<p>Attends l'apparition de la cible… et sois le premier à cliquer.</p>
<button onclick="start()">JOUER</button>
<div class="small">Démo iPhone · aucun paiement réel</div>
</div>
</section>
<section id="game">
<div id="count">Prépare-toi…</div>
<button id="target" aria-label="Cliquer"></button>
</section>
<section id="win">
<h2>🎯 TOUCHÉ !</h2>
<div>Ton temps de réaction</div>
<div id="time" class="time">0.000 s</div>
<button onclick="start()">REJOUER</button>
<button onclick="home()" style="background:#202735">ACCUEIL</button>
</section>
<script>
let shown=0,done=false;
const homeEl=document.getElementById('home'),game=document.getElementById('game'),win=document.getElementById('win'),count=document.getElementById('count'),target=document.getElementById('target'),time=document.getElementById('time');
function start(){
homeEl.style.display='none';win.style.display='none';game.style.display='flex';target.style.display='none';done=false;
let n=3;count.textContent='La cible arrive dans '+n+' s';
let id=setInterval(()=>{n--;if(n>0)count.textContent='La cible arrive dans '+n+' s';else{clearInterval(id);show()}},1000);
}
function show(){count.textContent='';target.style.left=(8+Math.random()*84)+'%';target.style.top=(12+Math.random()*76)+'%';target.style.display='block';shown=performance.now()}
target.onclick=()=>{if(done)return;done=true;time.textContent=((performance.now()-shown)/1000).toFixed(3)+' s';target.style.display='none';game.style.display='none';win.style.display='flex'}
function home(){game.style.display='none';win.style.display='none';homeEl.style.display='flex'}
</script>
</body>
</html>
